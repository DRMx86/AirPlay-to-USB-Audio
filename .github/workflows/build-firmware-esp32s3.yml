name: Build firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed only for the tag release step at the bottom

jobs:
  build:
    name: Build ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ESP32-S3 DevKitC-1 only (the repo's default env).
        env:
          - esp32s3

    steps:
      - name: Checkout (with u8g2 submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'dependencies.lock', 'sdkconfig.defaults*') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      # platformio.ini lists user_platformio.ini in extra_configs; make sure it exists.
      - name: Ensure optional user config exists
        run: touch user_platformio.ini

      - name: Build firmware
        run: pio run -e ${{ matrix.env }}

      # Equivalent of `pio run -t uploadfs`: builds the SPIFFS image with the web UI.
      - name: Build SPIFFS (web UI) image
        run: pio run -e ${{ matrix.env }} -t buildfs

      - name: Collect binaries
        run: |
          mkdir -p out/${{ matrix.env }}
          cd .pio/build/${{ matrix.env }}
          for f in bootloader.bin partitions.bin firmware.bin spiffs.bin firmware.elf; do
            [ -f "$f" ] && cp "$f" ../../../out/${{ matrix.env }}/ || echo "missing: $f"
          done
          ls -la ../../../out/${{ matrix.env }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: out/${{ matrix.env }}/
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Zip each board
        run: |
          cd dist
          for d in firmware-*; do zip -r "$d.zip" "$d"; done

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
