name: Build firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed only for the tag release step at the bottom

jobs:
  build:
    name: Build ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ESP32-S3 DevKitC-1 only (the repo's default env).
        env:
          - esp32s3

    steps:
      - name: Checkout (with u8g2 submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'dependencies.lock', 'sdkconfig.defaults*') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      # platformio.ini lists user_platformio.ini in extra_configs; make sure it exists.
      - name: Ensure optional user config exists
        run: touch user_platformio.ini

      - name: Build firmware
        run: pio run -e ${{ matrix.env }}

      # Equivalent of `pio run -t uploadfs`: builds the SPIFFS image with the web UI.
      - name: Build SPIFFS (web UI) image
        run: pio run -e ${{ matrix.env }} -t buildfs

      - name: Collect binaries and merge into one image
        run: |
          pip install "esptool<5"
          B=.pio/build/${{ matrix.env }}
          OUT=out/${{ matrix.env }}
          mkdir -p "$OUT"
          for f in bootloader.bin partitions.bin firmware.bin spiffs.bin firmware.elf ota_data_initial.bin; do
            if [ -f "$B/$f" ]; then cp "$B/$f" "$OUT/"; else echo "missing: $f"; fi
          done
          # Save the exact settings this build used, for comparing against a local build.
          for f in sdkconfig.${{ matrix.env }} "$B/config/sdkconfig.h" dependencies.lock; do
            if [ -f "$f" ]; then cp "$f" "$OUT/"; else echo "missing: $f"; fi
          done
          ARGS="0x0 $B/bootloader.bin 0x8000 $B/partitions.bin"
          if [ -f "$B/ota_data_initial.bin" ]; then ARGS="$ARGS 0x19000 $B/ota_data_initial.bin"; fi
          ARGS="$ARGS 0x20000 $B/firmware.bin 0x620000 $B/spiffs.bin"
          python -m esptool --chip esp32s3 merge_bin -o "$OUT/merged-airplay-esp32s3.bin" \
            --flash_mode dio --flash_freq 80m --flash_size 16MB $ARGS
          ls -la "$OUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: out/${{ matrix.env }}/
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Zip each board
        run: |
          cd dist
          for d in firmware-*; do zip -r "$d.zip" "$d"; done

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
